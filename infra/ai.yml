AWSTemplateFormatVersion: '2010-09-09'
Description: Peach agenda suggestions. No VPC, database, NAT, or paid endpoints.
Parameters:
  ProjectName:
    Type: String
    Default: peach
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  CognitoAuthority:
    Type: String
  CognitoClientId:
    Type: String
  CognitoJwksJson:
    Type: String
  FrontendOrigins:
    Type: CommaDelimitedList
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?$|^http://localhost:[0-9]+$'
    Description: Explicit HTTPS frontend origins; no wildcard. Add localhost only for local testing.
  ParserModel:
    Type: String
    Default: amazon.nova-lite-v1:0
    AllowedValues: [amazon.nova-lite-v1:0]
  InferenceResourceArn:
    Type: String
    Description: Exact in-region Nova Lite foundation-model ARN.
    AllowedPattern: '^arn:aws:bedrock:us-east-1::foundation-model/amazon\.nova-lite-v1:0$'
  InputUsdPerMillion:
    Type: Number
    MinValue: 0.000001
    Description: Verified current regional USD price per million input tokens.
  OutputUsdPerMillion:
    Type: Number
    MinValue: 0.000001
  ParserEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      # Administrator creates this boundary policy separately; operator cannot edit it.
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/PeachAgendaParserBoundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: parser
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref InferenceResourceArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-agenda-parser'
      RetentionInDays: 7
  Parser:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-agenda-parser'
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      ImageConfig: {Command: [app.ai.agenda_lambda.handler]}
      Architectures: [!Ref Architecture]
      Role: !GetAtt Role.Arn
      MemorySize: 512
      Timeout: 30
      # Low-traffic lab uses shared account concurrency; no reservation or provisioned capacity.
      LoggingConfig: {LogGroup: !Ref LogGroup}
      Environment:
        Variables:
          APP_ENV: production
          COGNITO_AUTHORITY: !Ref CognitoAuthority
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS_JSON: !Ref CognitoJwksJson
          PARSER_MODEL: !Ref ParserModel
          PARSER_ENABLED: !Ref ParserEnabled
          PARSER_MAX_TOKENS: '2048'
          PARSER_REQUESTS_PER_MINUTE: '3'
          PARSER_INPUT_USD_PER_MILLION: !Ref InputUsdPerMillion
          PARSER_OUTPUT_USD_PER_MILLION: !Ref OutputUsdPerMillion
  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Parser
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref FrontendOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
Outputs:
  ParserUrl:
    Value: !GetAtt Url.FunctionUrl
  FunctionName:
    Value: !Ref Parser
