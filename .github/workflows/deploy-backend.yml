name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running production update. Manual cleanup shares this group.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peach
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: peach_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peach -d peach_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://peach:ci-disposable-only@127.0.0.1:5432/peach_ci_test
      DATABASE_URL: postgresql+asyncpg://peach:ci-disposable-only@127.0.0.1:5432/peach_ci_test
      APP_ENV: test
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          uv python install 3.14
          uv sync --frozen
      - name: Backend lint, formatting and tests
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Deployment safety tests and migration compatibility
        run: |
          backend/.venv/bin/ruff check --isolated --select E4,E7,E9,F,I,UP,B scripts
          backend/.venv/bin/ruff format --isolated --check scripts
          backend/.venv/bin/python -m pytest scripts/tests -q
          backend/.venv/bin/python scripts/schema-release.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate GitHub workflow syntax
        run: |
          validator_dir=$(mktemp -d)
          trap 'rm -rf "$validator_dir"' EXIT
          base_url=https://github.com/rhysd/actionlint/releases/download/v1.7.7
          curl -fsSL "$base_url/actionlint_1.7.7_linux_amd64.tar.gz" -o "$validator_dir/actionlint_1.7.7_linux_amd64.tar.gz"
          curl -fsSL "$base_url/actionlint_1.7.7_checksums.txt" -o "$validator_dir/checksums.txt"
          (cd "$validator_dir" && grep ' actionlint_1.7.7_linux_amd64.tar.gz$' checksums.txt | sha256sum --check -)
          tar -xzf "$validator_dir/actionlint_1.7.7_linux_amd64.tar.gz" -C "$validator_dir" actionlint
          "$validator_dir/actionlint" -shellcheck= -pyflakes=
      - name: CloudFormation lint
        run: |
          uv tool run --from cfn-lint==1.57.2 cfn-lint --regions us-east-1 --ignore-checks W1011 --template infra/backend.yaml
          uv tool run --from cfn-lint==1.57.2 cfn-lint --regions us-east-1 --template infra/migrations.yaml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate ARM64 Lambda image without publishing
        run: |
          docker buildx build --platform linux/arm64 --target lambda \
            --provenance=false --sbom=false --load --tag peach-backend:validation backend
          docker run --rm --platform linux/arm64 \
            --entrypoint python \
            -e DATABASE_URL="$DATABASE_URL" -e APP_ENV=test \
            peach-backend:validation -c \
            'import app.lambda_handler, app.migration_handler, app.reporting.builder, app.reporting.mailer'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    name: Lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select deployment Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Auth outputs come from HCP Terraform (org/workspace pinned in infra/versions.tf).
      # The token only needs to read outputs; this job never plans or applies.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Initialize Terraform output backend
        working-directory: infra
        run: terraform init -input=false -lockfile=readonly
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.PEACH_TF_OUTPUTS_TOKEN }}
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-backend-${{ github.run_id }}
          unset-current-credentials: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Deploy guarded existing backend
        run: make deploy-backend
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          PEACH_EXPECTED_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          PEACH_APPROVED_MIGRATION_SHA256: ${{ vars.PEACH_APPROVED_MIGRATION_SHA256 }}
          PEACH_RELEASE_SNAPSHOT_ID: ${{ vars.PEACH_RELEASE_SNAPSHOT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          TF_TOKEN_app_terraform_io: ${{ secrets.PEACH_TF_OUTPUTS_TOKEN }}
      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend release"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Result: ${{ job.status }}"
            echo "Reporting infrastructure and frontend were not deployed."
          } >> "$GITHUB_STEP_SUMMARY"
