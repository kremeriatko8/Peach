name: Deploy backend

# Deploy on every push to main or manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: an interrupted
# CloudFormation update is worse than a queued one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Lambda
    runs-on: ubuntu-latest
    permissions:
      # Required to fetch the OIDC token that AWS trades for the role. The job
      # holds no long-lived credentials.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-backend-${{ github.run_id }}

      # The function runs on arm64 and this runner is x86, so the image is
      # built under emulation. Swapping to a `ubuntu-24.04-arm`
      # runner makes it native, and these two steps unnecessary.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        run: make deploy-backend
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # There is no .env here. Everything else falls back to the script's
          # defaults, and any parameter left empty keeps whatever the stack
          # already has - so a deploy from CI will not undo CORS settings.
          PEACH_RELEASE_SNAPSHOT_ID: ${{ vars.PEACH_RELEASE_SNAPSHOT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}

      - name: Summary
        if: always()
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME:-peach}-backend" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "unknown")
          {
            echo "### Backend deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA::12}\` |"
            echo "| api | ${API_URL} |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
